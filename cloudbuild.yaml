steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_IMAGE_NAME:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_IMAGE_NAME:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'promptwars-pii-shield'
      - '--image'
      - '$_IMAGE_NAME:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - '$_IMAGE_NAME:$COMMIT_SHA'

substitutions:
  _IMAGE_NAME: 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/promptwars-pii-shield'
